name: Build Docker PostgreSQL

on:
  push:
    branches:
      - main
    paths:
      - 'postgres/**'
      - 'versions-config.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: datalens-tech/datalens-postgres

jobs:
  run:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: postgres_version
        name: Read PostgreSQL version
        shell: bash
        run: |
          postgresql_version="$(jq -er '.postgresqlVersion | select(type == "string")' versions-config.json)"
          postgres_version="$(echo "${postgresql_version}" | sed 's|-.*||')"
          echo "postgres_version=${postgres_version}" >> "${GITHUB_OUTPUT}"
          echo "image_version=${postgresql_version}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
        with:
          platforms: 'arm64'
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.postgres_version.outputs.postgres_version }}
            type=raw,value=${{ steps.postgres_version.outputs.image_version }}
      - uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          build-args: |
            POSTGRES_VERSION=${{ steps.postgres_version.outputs.postgres_version }}
          context: ./postgres
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
